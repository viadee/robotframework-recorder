<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>RobotFramework Recorder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="../assets/theme.css">
  <link rel="stylesheet" type="text/css" href="../assets/style.css">
</head>

<body class="container">
  <div class="padding">
    <span>
      <button class="btn btn-wide" id="record" title="Record user action" aria-label="Record" data-intro="Start recording actions" data-position="bottom">
        Record
      </button>

      <button class="btn btn-wide" id="stop" title="Stop the recording" aria-label="Stop">
        Stop
      </button>

      <button class="btn btn-wide" id="resume" title="Resume with the recording" aria-label="Resume">
        Resume
      </button>

      <button class="btn btn-wide" id="pause" title="Pause the recording" aria-label="Pause">
        Pause
      </button>

      <button class="btn btn-wide" id="scan" title="Scan entire page" aria-label="Scan Page" data-intro="Generate a script referencing interactive elements on the page" data-position="bottom">
        Scan Page
      </button>

      <button class="btn" id="xpath-console" title="Show/hide XPath console" aria-label="Validate XPath" data-intro="Open interactive XPath console" data-position="bottom">
        Validate XPath
      </button>

      <button class="btn" id="open-actions-view" title="Open actions viewer" aria-label="Script View">
        Script View
      </button>

    </span>

    <button class="btn btn-thin btn-last" id="info" title="Toggle instructions" aria-label="Info"></button>
    <button class="btn btn-thin" id="settings" title="Show/hide settings" aria-label="Settings" data-intro="Settings" data-position="bottom"></button>
  </div>

  <div class="pad">
    <output id="status-field"></output>
  </div>

  <div id="settings-panel" class="hidden">
    <div class="panel-row">
      <div>
        <h3 id="target-library-label">Target Library</h3>
        <div class="toggle toggle-last">
          <input type="radio" class="target" id="target_rfbrowser" name="target_library">
          <label for="target_rfbrowser" id="rfbrowser-label">RobotFramework Browser</label>
        </div>
        <div class="toggle">
          <input type="radio" class="target" id="target_seleniumlibrary" name="target_library">
          <label for="target_seleniumlibrary" id="selenium-label">RPA.Browser.Selenium / SeleniumLibrary</label>
        </div>
      </div>
      <div>
        <h3 id="target-syntax-label">Target RF Syntax</h3>
        <div class="toggle">
          <input type="radio" class="syntax" name="syntax" id="syntax_rpa">
          <label for="syntax_rpa" id="rpa-label">RPA (Tasks)</label>
        </div>
        <div class="toggle toggle-last">
          <input type="radio" class="syntax" name="syntax" id="syntax_testing">
          <label for="syntax_testing" id="test-automation-label">Test Automation (Test cases)</label>
        </div>
      </div>
      <div>
        <h3 id="language-label">Language</h3>
        <div class="toggle">
          <input type="radio" class="language-option" id="lang_en" name="language" value="en">
          <label for="lang_en">English</label>
        </div>
        <div class="toggle toggle-last">
          <input type="radio" class="language-option" id="lang_de" name="language" value="de">
          <label for="lang_de">Deutsch</label>
        </div>
      </div>
      <div>
        <h3 id="advanced-settings-label">Advanced settings</h3>
        <div class="toggle">
          <input type="checkbox" id="demo">
          <label for="demo" id="demo-label"> Add a sleep after each action (for creating easy-to-showcase demo scripts) </label>
        </div>
        <div class="toggle toggle-last">
          <input type="checkbox" id="verify">
          <label for="verify" id="verify-label">Check page contains element before performing the action</label>
        </div>
      </div>
    </div>
  </div>

  <div class="pad" id="script-container">
    <!-- Line-based editable script view -->
    <div id="script-container-lines">
      <div id="script-lines" class="script-lines" title="Generated script" role="list" aria-label="Generated script lines"></div>
    </div>
    <div id="script-actions">
      <div>
        <button class="btn btn-context" id="copy" title="Copy to clipboard" aria-label="Copy" disabled>
          Copy
        </button>
        <button class="btn btn-context" id="save" disabled title="Download test script" aria-label="Download">
          Download
        </button>
      </div>
      <div>
        <button class="btn btn-context" id="add-line" title="Add new line" aria-label="Add line">
          Add line
        </button>
        <button class="btn btn-context btn-last" id="clear-script" title="Clear script" aria-label="Clear">
          Clear
        </button>
      </div>
    </div>
  </div>

  <div class="hidden" id="xpath-inputs">
    <input type="text" id="textinput-xpath" title="XPath expression" aria-label="XPath expression" class="horizontal-pad" placeholder="//xpath-to-validate">
  </div>

  <div class="pad">
    <textarea class="hidden" id="textarea-log" readonly aria-label="Log output"></textarea>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
